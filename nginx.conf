user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream servers
    upstream laravel-modernized {
        server laravel-modernized:8000;
    }

    upstream hris-itk-ijk {
        server hris-itk-ijk:8000;
    }

    upstream react-modernized {
        server react-modernized:3000;
    }

    upstream ui-modernized {
        server ui-modernized:3000;
    }

    upstream quantum-hybrid {
        server quantum-hybrid:5000;
    }

    upstream quantum-diffusion {
        server quantum-diffusion:5000;
    }

    upstream email-spam-detector {
        server email-spam-detector:5000;
    }

    upstream credit-fraud-detector {
        server credit-fraud-detector:5000;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream kibana {
        server kibana:5601;
    }

    # Server configuration
    server {
        listen 80;
        server_name localhost;

        # Laravel Modernized
        location /laravel {
            proxy_pass http://laravel-modernized;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HRIS ITK IJK
        location /hris {
            proxy_pass http://hris-itk-ijk;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React Modernized
        location /react {
            proxy_pass http://react-modernized;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # UI Modernized
        location /ui {
            proxy_pass http://ui-modernized;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Quantum Hybrid
        location /quantum-hybrid {
            proxy_pass http://quantum-hybrid;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Quantum Diffusion
        location /quantum-diffusion {
            proxy_pass http://quantum-diffusion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Email Spam Detector
        location /email-spam {
            proxy_pass http://email-spam-detector;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Credit Fraud Detector
        location /credit-fraud {
            proxy_pass http://credit-fraud-detector;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana
        location /grafana {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Kibana
        location /kibana {
            proxy_pass http://kibana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default - landing page
        location / {
            return 200 "Multi-Project Platform\n\nAvailable services:\n- /laravel - Laravel Modernized\n- /hris - HRIS ITK IJK\n- /react - React Modernized\n- /ui - UI Modernized\n- /quantum-hybrid - Quantum Hybrid ML\n- /quantum-diffusion - Quantum Diffusion ML\n- /email-spam - Email Spam Detector\n- /credit-fraud - Credit Fraud Detector\n- /grafana - Grafana Monitoring\n- /kibana - Kibana Logging\n";
            add_header Content-Type text/plain;
        }
    }
}
